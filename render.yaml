services:
  - type: web
    name: agentflow-server
    runtime: node
    plan: free
    buildCommand: npm install && npx tsc --project tsconfig.server.json && echo '{"type":"commonjs"}' > dist-server/package.json
    startCommand: node dist-server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVER_PORT
        value: 10000
