# =============================================================================
# Deploy to Cloudflare Pages
# -----------------------------------------------------------------------------
# 触发：push 到 main 或 手动 workflow_dispatch
#
# ⚠️ 必填的 GitHub Secrets（Settings → Secrets and variables → Actions → Secrets）：
#   - CLOUDFLARE_API_TOKEN : 具有 Pages:Edit 权限的 Cloudflare API Token
#   - CLOUDFLARE_ACCOUNT_ID: Cloudflare 账户 ID
#
# ⚠️ 必填的 GitHub Variables（Settings → Secrets and variables → Actions → Variables）：
#   - VITE_API_BASE : 前端要调用的后端地址，例如 https://agentflow-server.onrender.com/api
#     缺失会导致构建出的前端不知道后端在哪（API 全部失败）。
# =============================================================================
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}

      - name: Debug build env
        run: echo "VITE_API_BASE is set: ${{ vars.VITE_API_BASE != '' }}"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: agentflow
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
