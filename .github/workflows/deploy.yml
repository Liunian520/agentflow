# Deploy to Cloudflare Pages
# Required GitHub Secrets:
#   CLOUDFLARE_API_TOKEN  - Cloudflare API Token with Pages:Edit
#   CLOUDFLARE_ACCOUNT_ID - Cloudflare Account ID
# Required GitHub Variables (optional if using default below):
#   VITE_API_BASE - backend API URL, e.g. https://agentflow-server-71j2.onrender.com/api
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # 优先使用仓库变量；若未设置则回退到当前 Render 实例的真实地址
          VITE_API_BASE: ${{ vars.VITE_API_BASE || 'https://agentflow-server-71j2.onrender.com/api' }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: agentflow
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
